<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marcos André | SQL & Web Front-End</title>
    <style>
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 30px;
            max-width: 450px;
            text-align: center;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        h1 { color: #f0f6fc; font-size: 1.5rem; margin-bottom: 5px; }
        p { color: #8b949e; font-size: 0.95rem; margin-bottom: 20px; }
        .badge {
            display: inline-block;
            background: rgba(88, 166, 255, 0.1);
            color: #58a6ff;
            border: 1px solid rgba(88, 166, 255, 0.3);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            margin: 4px;
        }
        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #238636;
            color: #ffffff;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 600;
        }
        .btn:hover { background-color: #2ea043; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Marcos André S. Cardoso</h1>
        <p>Especialista em Consultas SQL, Bancos de Dados e Desenvolvimento Web (HTML/CSS).</p>
        
        <div>
            <span class="badge">SQL & Queries</span>
            <span class="badge">Bancos Relacionais</span>
            <span class="badge">HTML5 / CSS3</span>
            <span class="badge">Python & Pandas</span>
        </div>

        <br>
        <a href="https://github.com/Marcos-Sousa-EXE" class="btn" target="_blank">Ver GitHub</a>
    </div>
</body>
</html>
